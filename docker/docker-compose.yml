services:
  # מסד הנתונים של רשימת הקניות; ה-backend מדבר איתו
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shoplist
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shopuser", "-d", "shoplist"]
      interval: 10s
      timeout: 5s
      retries: 5


  # שרת ה-API בפייתון; מדבר עם postgres ומקבל בקשות מ-frontend ומ-stats
  backend:
    build:
      context: ../app/backend
    environment:
      DB_HOST: postgres
      DB_NAME: shoplist
      DB_USER: shopuser
      DB_PASSWORD: shoppass


  # שירות הסטטיסטיקות ב-Node; מבקש נתונים מה-backend
  stats:
    build:
      context: ../app/stats
    environment:
      BACKEND_URL: http://backend:5000


  # nginx שמגיש את האתר ומעביר בקשות API ל-backend ול-stats
  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile.multistage
    ports:
      - "8080:80"


volumes:
  postgres-data: