# backend-deployment.yml - the image we built, with passwords from the Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend                     # the backend label
  template:
    metadata:
      labels:
        app: backend                   # exactly the same label
    spec:
      containers:
        - name: backend
          image: shoplist-backend:local               # the image we built in step 1, including the tag
          imagePullPolicy: Never     # do not download: the image is already on this computer
          env:
            - name: DB_HOST
              value: postgres           # name of the postgres Service. Not a secret, so written directly
            - name: DB_NAME
              valueFrom:
                configMapRef:
                  name: ____        # name of the Secret
                  key: ____         # which Secret key holds the database name?
            - name: DB_USER
              valueFrom:
                configMapRef:
                  name: ____
                  key: ____         # which key holds the user?
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ____
                  key: ____         # which key holds the password?
          ports:
            - containerPort: ____   # Flask port
          readinessProbe:
            httpGet:
              path: ____            # the endpoint that answers "I am ready"
              port: ____
            initialDelaySeconds: 5
            periodSeconds: 10
